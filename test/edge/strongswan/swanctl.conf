# strongSwan, as a road-warrior client of the edge's IKEv2 listener:
# EAP-MSCHAPv2 as alice, so the session the edge reports names a user the
# password proved, not just the client's IKE identity.
connections {
    edge {
        version = 2
        remote_addrs = 198.18.1.10
        proposals = aes256gcm16-prfsha256-curve25519
        encap = yes
        vips = 0.0.0.0
        local {
            auth = eap-mschapv2
            id = alice
            eap_id = alice
        }
        remote {
            auth = psk
            id = vpn.example.com
        }
        children {
            edge {
                esp_proposals = aes256gcm16
                remote_ts = 10.78.0.0/24
            }
        }
    }
}

secrets {
    ike-edge {
        secret = "edge-lab-psk"
    }
    eap-alice {
        id = alice
        secret = "wonderland"
    }
}
