# The lab router: DHCP and DNS for lab.test, nothing forwarded upstream.
no-resolv
no-hosts
bind-dynamic
listen-address=10.77.0.10
domain=lab.test
local=/lab.test/
local-ttl=300
dhcp-range=10.77.0.100,10.77.0.150,255.255.255.0,12h
dhcp-option=option:router,10.77.0.10
dhcp-option=option:dns-server,10.77.0.10
dhcp-host=3c:22:fb:00:00:64,10.77.0.100,lab-laptop
dhcp-authoritative
host-record=www.lab.test,198.18.0.30
host-record=quic.lab.test,198.18.0.30
host-record=plain.lab.test,198.18.0.30
host-record=hold.lab.test,198.18.0.30
cname=alias.lab.test,www.lab.test
log-queries
log-dhcp
log-facility=-
