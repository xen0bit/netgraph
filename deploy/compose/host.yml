# netgraph-sensor on a Linux router or host, capturing a physical or bridge
# interface (br-lan on OpenWrt-like setups). The server can be anywhere the
# sensor can reach; set NETGRAPH_SERVER to it.
services:
  netgraph-sensor:
    image: ghcr.io/xen0bit/netgraph-sensor:latest
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    read_only: true
    environment:
      NETGRAPH_TOKEN: ${NETGRAPH_TOKEN:?set NETGRAPH_TOKEN}
    command: ["run", "-iface", "${NETGRAPH_IFACE:-br-lan}", "-server", "${NETGRAPH_SERVER:?set NETGRAPH_SERVER}"]
    restart: unless-stopped
