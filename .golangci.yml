version: "2"
linters:
  settings:
    errcheck:
      # Writes to stdout or to an HTTP client that may have gone away, and
      # rollbacks after an error that is already being returned: there is
      # nothing useful to do with these errors.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString
        - io.Copy
        - (net/http.ResponseWriter).Write
        - (*database/sql.Tx).Rollback
        - os.RemoveAll
    staticcheck:
      checks: [all, -ST1000, -ST1003, -ST1016, -ST1020, -ST1021, -ST1022, -QF1001]
  exclusions:
    rules:
      - linters:
          - errcheck
        source: '\.Close\(\)'
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
