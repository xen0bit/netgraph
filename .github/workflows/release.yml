name: release

# Every pushed v* tag. Also dispatchable: a dropped tag-push event leaves a
# tag with no release, and dispatching against the tag re-runs it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release itself
      id-token: write   # cosign keyless signing
      packages: write   # GHCR images
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - run: go test -race -timeout 20m ./...
      # 2.6.5, not 2.4.x or 3.x: goreleaser-action verifies its own download
      # with the cosign on PATH (needs >= 2.6 for the bundle format), and the
      # signs stanza uses --output-certificate, which 3.x dropped.
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.6.5"
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: "v1.18.1"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
