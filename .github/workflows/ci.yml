name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # Pinned + latest; check-latest is what makes "1.x" resolve to a
        # toolchain at least as new as go.mod requires (see pwrq's ci.yml).
        go: ["1.27", "1.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod $(ls go.sum 2>/dev/null)
      - name: Test
        run: go test -race -timeout 20m ./...

  lint:
    name: lint & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Exactly 1.27.0: golangci-lint cannot read newer patch export data
      # until it is bumped alongside (pwrq found this the hard way).
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"; echo "$unformatted"; exit 1
          fi
      - name: Vet
        run: |
          go vet ./...
          go vet -tags lab ./test/lab/...
          GOOS=js GOARCH=wasm go vet ./cmd/web
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
          cache: true
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  # The sensor ships to mips/arm routers nobody runs CI on; a compile on
  # every release target is what catches 32-bit and softfloat breakage
  # before a tag does. Same target list as the Makefile and goreleaser.
  cross:
    name: cross-build (release architectures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - run: make cross
      - name: Build the web UI and the server that embeds it
        run: |
          make web.build
          CGO_ENABLED=0 go build -tags embed_web -o /dev/null ./cmd/netgraph
      - name: Sensor size budget
        run: |
          # A router has a few MB of flash to spare. Fail before that stops
          # being true rather than after.
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat \
            go build -trimpath -ldflags "-s -w" -o sensor ./cmd/netgraph-sensor
          size=$(stat -c %s sensor)
          echo "netgraph-sensor linux/mipsle: $size bytes"
          [ "$size" -le $((12 * 1024 * 1024)) ] || { echo "::error::sensor exceeds 12 MiB"; exit 1; }

  docker:
    name: docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make docker

  release-dry-run:
    name: release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: "v1.18.1"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          # Signing needs an OIDC identity this job has no business holding.
          args: release --snapshot --clean --skip=sign,publish,announce

  # The isolated docker-compose lab (test/lab): real containers, real
  # packets, a sensor sidecar and the server, asserted through the API.
  lab:
    name: lab (docker compose e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - run: make lab
