name: ci

on:
  push:
    branches: [main]
  # Every pull request, including stacked ones based on another branch.
  pull_request:
  workflow_dispatch:
  # Weekly fuzz run; too slow for every pull request.
  schedule:
    - cron: '0 4 * * 0'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # Pinned + latest; check-latest is what makes "1.x" resolve to a
        # toolchain at least as new as go.mod requires (see pwrq's ci.yml).
        go: ["1.27", "1.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod $(ls go.sum 2>/dev/null)
      - name: Test
        run: go test -race -timeout 20m ./...
      # The AllocsPerRun guards on vpn/'s data paths skip under -race, which
      # perturbs allocation counts, so they only run in this second pass.
      - name: Test vpn/ without the race detector
        run: go test -timeout 20m ./vpn/...

  lint:
    name: lint & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Exactly 1.27.0: golangci-lint cannot read newer patch export data
      # until it is bumped alongside (pwrq found this the hard way).
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"; echo "$unformatted"; exit 1
          fi
      - name: Vet
        run: |
          go vet ./...
          go vet -tags lab ./test/lab/...
          go vet -tags browser ./test/browser/...
          # The host agent's macOS and Windows code only builds there.
          GOOS=darwin go vet ./cmd/netgraph-agent/... ./internal/agent/...
          GOOS=windows go vet ./cmd/netgraph-agent/... ./internal/agent/...
          # vpn/'s Docker interop cells, and its macOS client (TUN, routes, DNS),
          # which no runner here executes: compiling is the most CI can prove.
          go vet -tags interop ./vpn/tests/interop/...
          GOOS=darwin GOARCH=arm64 go vet ./vpn/...
          GOOS=darwin GOARCH=amd64 go build ./vpn/...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
          cache: true
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  # The agent's BPF objects are checked in so building it needs no clang.
  # This compiles src/conn.c and checks that the source the objects were built
  # from hasn't changed without `make bpf` (a recorded source hash), plus the C
  # and Go struct layouts. Objects aren't compared byte for byte: a compiler or
  # header update would fail that for no reason.
  bpf:
    name: bpf objects
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compile src/conn.c for both endiannesses
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libbpf-dev linux-libc-dev
          # Debian and Ubuntu keep asm/types.h under the multiarch triplet,
          # which the BPF target does not search itself.
          inc="-I/usr/include/$(gcc -dumpmachine)"
          cd internal/agent/linux/bpf/src
          for e in el eb; do
            clang $inc -O2 -g -Wall -Werror -target bpf$e -c conn.c -o /tmp/conn_bpf$e.o
          done
      - name: Object layout and source pin
        # eventSize matches struct event (with a C _Static_assert of the same
        # size), and conn.c's hash matches the one make bpf recorded. Objects
        # are not compared byte for byte: that depends on the clang and header
        # versions, and a rebuilt Docker image would fail it for no reason.
        run: go test ./internal/agent/linux/bpf/

  # Seed corpora live in each package's testdata/fuzz and run in the normal
  # test job; here every target is fuzzed for a bounded time. Scheduled and
  # dispatch only: sixty seconds times dozens of targets is too slow for a PR.
  fuzz:
    name: fuzz (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - run: make fuzz FUZZTIME=60s

  # The host agent on the platforms nobody builds the rest for: each
  # scanner's live test opens a connection and expects to see it, with its
  # own process, from the real lsof/ps (macOS) or TCP table (Windows).
  agent:
    name: agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - run: go test -v ./internal/agent/... ./cmd/netgraph-agent/...
      - name: Build and run
        shell: bash
        run: |
          CGO_ENABLED=0 go build -o netgraph-agent-bin ./cmd/netgraph-agent
          ./netgraph-agent-bin -version
          # No token: it must refuse to start rather than run open.
          if NETGRAPH_AGENT_TOKEN= ./netgraph-agent-bin -once; then exit 1; fi

  # Real journeys through the web UI, in the Chrome the runner ships with.
  browser:
    name: browser journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - run: make browser

  # The sensor ships to mips/arm routers nobody runs CI on; a compile on
  # every release target is what catches 32-bit and softfloat breakage
  # before a tag does. Same target list as the Makefile and goreleaser.
  cross:
    name: cross-build (release architectures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - run: make cross
      - run: make test32
      - name: Build the web UI and ASN table, and the server that embeds them
        run: |
          make web.build asn.fetch
          CGO_ENABLED=0 go build -tags embed_web,embed_asn -o /dev/null ./cmd/netgraph
          go test -tags embed_asn -run TestEmbedded -v ./internal/asn
      - name: Sensor size budget
        run: |
          # A router has a few MB of flash to spare. Fail before that stops
          # being true rather than after.
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat \
            go build -trimpath -ldflags "-s -w" -o sensor ./cmd/netgraph-sensor
          size=$(stat -c %s sensor)
          echo "netgraph-sensor linux/mipsle: $size bytes"
          [ "$size" -le $((12 * 1024 * 1024)) ] || { echo "::error::sensor exceeds 12 MiB"; exit 1; }

  docker:
    name: docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make docker

  release-dry-run:
    name: release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: "v1.18.1"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          # Signing needs an OIDC identity this job has no business holding.
          args: release --snapshot --clean --skip=sign,publish,announce

  # The isolated docker-compose lab (test/lab): real containers, real
  # packets, a sensor sidecar and the server, asserted through the API.
  lab:
    name: lab (docker compose e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - run: make lab
